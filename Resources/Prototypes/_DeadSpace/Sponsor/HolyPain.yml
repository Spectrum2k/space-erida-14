# HolyPain sponsor set. Erida edit: imported from DeadSpace and adapted to local components.

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackHolyPain
  name: блюспейс кристал HolyPain
  categories: [ HideSpawnMenu ]
  description: Уникальный артефакт на золотой цепи — творение мастера HolyPain, стабилизированный в условиях мёртвого космоса и вручаемый как знак заслуг за вклад в одноимённый проект.
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/HolyPain/backpack.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,15,10
    storageOpenSound:
      collection: HolyPainCrystalBagOpening
      params:
        variation: 0.125
    storageCloseSound:
      collection: HolyPainCrystalBagClosing
      params:
        variation: 0.125
    storageInsertSound:
      collection: HolyPainCrystalBagItemInsert
      params:
        variation: 0.125
    storageRemoveSound:
      collection: HolyPainCrystalBagItemRemove
      params:
        variation: 0.125
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: Clothing
    sprite: _DeadSpace/Sponsor/HolyPain/backpack.rsi
    quickEquip: false
    slots:
    - back
    equipSound:
      collection: HolyPainCrystalBagEquip
      params:
        volume: -9
        variation: 0.125
    unequipSound:
      collection: HolyPainCrystalBagUnequip
      params:
        volume: -9
        variation: 0.125
  - type: EmitSoundOnPickup
    sound:
      collection: HolyPainCrystalBagPickup
      params:
        volume: -9
        variation: 0.125
  - type: EmitSoundOnDrop
    sound:
      collection: HolyPainCrystalBagDrop
      params:
        volume: -11
        variation: 0.125
  - type: EmitSoundOnLand
    sound:
      collection: HolyPainCrystalBagLand
      params:
        volume: -11
        variation: 0.125
  - type: StorageFill
    contents:
      - id: PillCanisterBicaridine
      - id: PillCanisterDylovene
      - id: PillCanisterDermaline
      - id: PillCanisterDexalin
      - id: PillCanisterHyronalin
      - id: ClothingHandsGlovesHolyPainSecond
      - id: SyringeHolyPain
      - id: SyringeHolyPain
      - id: SyringeHolyPain
      - id: SyringeHolyPain
      - id: SyringeHolyPain
      - id: ClothingEyesGlassesHolyPain
      - id: BluespaceBeakerHolyPain
  - type: Tag
    tags: []

- type: entity
  parent: ClothingHandsGlovesCombat
  id: ClothingHandsGlovesHolyPainFirst
  name: объятия любимой
  description: Исследователь любви 25Hydra08 пишет, что стоит ему еще хоть раз прочитать, как женщину сравнивают с цветком (или какой-то географической характеристикой, раз уж на то пошло), он возьмет кувалду и пойдет стучаться в двери поэтов.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/HolyPain/gloves/first.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/HolyPain/gloves/first.rsi
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

- type: entity
  parent: ClothingHandsGlovesCombat
  id: ClothingHandsGlovesHolyPainSecond
  name: ласка любимого
  description: Самой прагматичной и храброй любовницей в истории была, конечно же, HolyPain. В ее честь названа популярная прическа, и для нее было написано множество чрезвычайно сопливых стихов (в большинстве из них она сравнивается с какими-нибудь географическими объектами).
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/HolyPain/gloves/second.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/HolyPain/gloves/second.rsi
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

- type: entity
  parent: [ SolutionToolSmall, BaseSyringe ]
  id: SyringeHolyPain
  name: бронзовый изумрудный шприц
  categories: [ HideSpawnMenu ]
  description: Используется для забора образцов крови у благородных и не очень существ, или для введения им реагентов.
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/HolyPain/syringe.rsi
    layers:
      - state: syringe1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
      - state: syringe_base0
        map: ["enum.SolutionContainerLayers.Base"]
  - type: Icon
    sprite: _DeadSpace/Sponsor/HolyPain/syringe.rsi
    state: syringe_base0
  - type: Item
    size: Tiny
    sprite: _DeadSpace/Sponsor/HolyPain/syringe.rsi

- type: entity
  parent: [ SolutionGinormous, BaseBeakerMetallic ]
  id: BluespaceBeakerHolyPain
  name: бронзовая мензурка с изумрудом
  categories: [ HideSpawnMenu ]
  description: Чем сосуд наполнен, то из него и льётся.
  components:
  - type: Spillable
    solution: beaker
  - type: Sprite
    sprite: _DeadSpace/Sponsor/HolyPain/beaker_bluespace.rsi
    layers:
      - state: beakerbluespace
  - type: Item
    sprite: _DeadSpace/Sponsor/HolyPain/beaker_bluespace.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 0
  - type: Solution
    solution:
      maxVol: 1000

- type: entity
  parent: ClothingEyesHudMultiversal
  id: ClothingEyesGlassesHolyPain
  name: визор с бронзовой оправой
  description: Высококлассный визор на половину лица, украшенный гравировкой с изображением рыцарских поединков на бронзовой оправе.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/HolyPain/hud.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/HolyPain/hud.rsi
  - type: EyeProtection
  - type: IdentityBlocker
    coverage: EYES
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

- type: entity
  parent: BaseSpeechPlushie
  id: PlushieHolyPainEri
  categories: [ HideSpawnMenu ]
  name: плюшевая Эри
  description: "Скажите ей спасибо, что оказались в такой ситуации! На бирке виднеется надпись: HolyPain"
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/HolyPain/plush.rsi
    state: icon
  - type: Item
    sprite: _DeadSpace/Sponsor/HolyPain/plush.rsi
  - type: Clothing
    quickEquip: false
    sprite: _DeadSpace/Sponsor/HolyPain/plush.rsi
    slots:
    - HEAD
  - type: Speech
    speechVerb: Reptilian
  - type: FoodSequenceElement
    entries:
      CottonBurger: LizardPlushie
  - type: Tag
    tags:
    - Payload
    - ClothMade
    - PlushieLizard
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceThatMakesYouWeh
        Quantity: 30
  - type: Solution
    id: food
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Fiber
        Quantity: 10
      - ReagentId: JuiceThatMakesYouWeh
        Quantity: 10
  - type: SpeakOnTrigger
    pack: HolyPainPlushieSpeak
  - type: TTS
    voice: Naisha

