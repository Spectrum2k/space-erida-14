name: Diff RSIs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '**.rsi/**.png'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  diff:
    name: Diff
    if: github.actor != 'Erida-change-bot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Get changed RSI files
        id: files
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: '**.rsi/**.png'
          use_rest_api: true
          output_renamed_files_as_deleted_and_added: true
          separator: ' '
          quotepath: false
          safe_output: false

      - name: Diff changed RSIs
        id: diff
        uses: space-wizards/RSIDiffBot@v1.1
        with:
          modified: ${{ steps.files.outputs.modified_files }}
          removed: ${{ steps.files.outputs.deleted_files }}
          added: ${{ steps.files.outputs.added_files }}
          basename: ${{ github.event.pull_request.base.repo.full_name }}
          basesha: ${{ github.event.pull_request.base.sha }}
          headname: ${{ github.event.pull_request.head.repo.full_name }}
          headsha: ${{ github.event.pull_request.head.sha }}

      - name: Potentially find comment
        uses: peter-evans/find-comment@v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          comment-author: 'github-actions[bot]'
          body-includes: RSI Diff Bot

      - name: Create comment if it doesn't exist
        if: steps.fc.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v5.0.0
        with:
          issue-number: ${{ github.event.number }}
          body: |
            ${{ steps.diff.outputs.summary-details }}

      - name: Update comment if it exists
        if: steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ${{ steps.diff.outputs.summary-details }}

      - name: Update comment to read that it has been edited
        if: steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: append
          body: |
            Edit: diff updated after ${{ github.event.pull_request.head.sha }}
