name: License Metadata Check

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]

permissions:
  contents: read

jobs:
  license_headers:
    name: License Metadata Check
    if: github.actor != 'Erida-change-bot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Check new file license headers
        run: >
          python3 Tools/Erida/check_license_headers.py
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref HEAD
          --format github
